services:
  db:
    image: postgres:16-alpine
    container_name: taxpilot-pg
    environment:
      POSTGRES_USER: taxpilot
      POSTGRES_PASSWORD: taxpilot
      POSTGRES_DB: taxpilot
    ports:
      - "5433:5432"
    volumes:
      - taxpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  taxpilot_pg:
